# Decides who can run the PR tests (pr-torture.yml) on the self-hosted runner. Two org teams,
# named in the org variables PR_TEST_ADMIN_TEAM and PR_TEST_TRUSTED_TEAM:
#   admins:  start the tests on any PR commenting "ok to test", force a new run with "test this please",
#            or run them from the Actions tab for a PR number
#   trusted: their own PRs run on every push, and they can force a new run of their own PR
#            with "test this please"
# Any other PR runs only when an admin starts it, and only for the commit the PR is at then.
# The dial-in tests, which need the VoxImplant credentials, run only for PRs of admins and trusted members.
# The same decision also starts the downstream prosody tests, if the PR changes the prosody plugins
# or their tests (see the downstream-prosody-tests job).
#
# The authorize job never checks out the PR. pull_request_target and issue_comment run this file from
# the default branch, a PR cannot change it.
name: PR torture

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'The PR to test'
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'ok to test') || contains(github.event.comment.body, 'test this please')))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      author-trusted: ${{ steps.decide.outputs.author-trusted }}
      pr-number: ${{ steps.decide.outputs.pr-number }}
      head-sha: ${{ steps.decide.outputs.head-sha }}
      pr-repo-url: ${{ steps.decide.outputs.pr-repo-url }}
      pr-branch: ${{ steps.decide.outputs.pr-branch }}
      target-branch: ${{ steps.decide.outputs.target-branch }}
    steps:
      # Only reads the team memberships and the PR
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 #v3.3.0
        with:
          app-id: ${{ secrets.PR_TORTURE_APP_ID }}
          private-key: ${{ secrets.PR_TORTURE_APP_KEY }}
          owner: jitsi
          repositories: ${{ github.event.repository.name }}
          permission-members: read
          permission-pull-requests: read

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ADMIN_TEAM: ${{ vars.PR_TEST_ADMIN_TEAM }}
          TRUSTED_TEAM: ${{ vars.PR_TEST_TRUSTED_TEAM }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
          ACTOR: ${{ github.event.comment.user.login || github.actor }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          in_team() {
              [ -n "$1" ] && [ "$(gh api "orgs/jitsi/teams/$1/memberships/$2" --jq .state 2>/dev/null)" = "active" ]
          }

          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          AUTHOR=$(jq -r .user.login <<< "$PR_JSON")
          STATE=$(jq -r .state <<< "$PR_JSON")

          AUTHOR_TRUSTED=false
          if in_team "$ADMIN_TEAM" "$AUTHOR" || in_team "$TRUSTED_TEAM" "$AUTHOR"; then
              AUTHOR_TRUSTED=true
          fi

          RUN=false
          if [ "$STATE" != "open" ]; then
              echo "PR #$PR_NUMBER is $STATE, not testing it"
          elif [ "$EVENT" = "pull_request_target" ]; then
              RUN=$AUTHOR_TRUSTED
          elif in_team "$ADMIN_TEAM" "$ACTOR"; then
              RUN=true
          elif [ "$EVENT" = "issue_comment" ] && [[ "${COMMENT,,}" == *"test this please"* ]] \
                  && [ "$ACTOR" = "$AUTHOR" ] && in_team "$TRUSTED_TEAM" "$ACTOR"; then
              RUN=true
          fi
          echo "PR #$PR_NUMBER by $AUTHOR (trusted: $AUTHOR_TRUSTED), $EVENT by $ACTOR: run=$RUN"

          {
              echo "run=$RUN"
              echo "author-trusted=$AUTHOR_TRUSTED"
              echo "pr-number=$PR_NUMBER"
              echo "head-sha=$(jq -r .head.sha <<< "$PR_JSON")"
              echo "pr-repo-url=$(jq -r .head.repo.clone_url <<< "$PR_JSON")"
              echo "pr-branch=$(jq -r .head.ref <<< "$PR_JSON")"
              echo "target-branch=$(jq -r .base.ref <<< "$PR_JSON")"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: ${{ steps.decide.outputs.run == 'true' && 'rocket' || '-1' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content="$REACTION" > /dev/null

  pr-torture:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    uses: ./.github/workflows/pr-torture.yml
    with:
      project: jitsi-meet
      pr-repo-url: ${{ needs.authorize.outputs.pr-repo-url }}
      pr-branch: ${{ needs.authorize.outputs.pr-branch }}
      target-branch: ${{ needs.authorize.outputs.target-branch }}
      pr-number: ${{ needs.authorize.outputs.pr-number }}
      head-sha: ${{ needs.authorize.outputs.head-sha }}
      dial-in: ${{ needs.authorize.outputs.author-trusted == 'true' }}
    secrets:
      PR_TORTURE_APP_ID: ${{ secrets.PR_TORTURE_APP_ID }}
      PR_TORTURE_APP_KEY: ${{ secrets.PR_TORTURE_APP_KEY }}
      VOX_API_KEY: ${{ secrets.VOX_API_KEY }}
      VOX_ACCOUNT_ID: ${{ secrets.VOX_ACCOUNT_ID }}
      VOX_HEALTH_CHECK_IN_RULE_ID: ${{ secrets.VOX_HEALTH_CHECK_IN_RULE_ID }}

  # Starts the prosody tests of a downstream repo. That repo has its own prosody plugins.
  # The job runs only when the authorize job decides to run the tests, and only when the PR changes
  # the prosody plugins or their tests.
  # It starts the workflow prosody-tests.yml on the master branch of that repo, with the inputs
  # jitsi_meet_commit (the head SHA of the PR) and pr_number. The downstream workflow tests that
  # commit and must post its result as a check run on it.
  # This job reads the list of changed files and sends the dispatch. It never checks out the PR.
  # The job is off until the repo variables DOWNSTREAM_TESTS_OWNER and DOWNSTREAM_TESTS_REPO are set.
  # The secrets DOWNSTREAM_TESTS_APP_CLIENT_ID and DOWNSTREAM_TESTS_APP_KEY hold the client ID and
  # the private key of a GitHub App. The App must be installed on that repo with "Actions: write".
  # Keep the two secrets in the environment downstream-prosody-tests, not in the repo. Allow only the
  # master branch in its deployment branch policy. Then a workflow on another branch cannot use the
  # App key to start the downstream tests without the authorize job.
  downstream-prosody-tests:
    needs: authorize
    if: >-
      needs.authorize.outputs.run == 'true' &&
      vars.DOWNSTREAM_TESTS_OWNER != '' && vars.DOWNSTREAM_TESTS_REPO != ''
    environment: downstream-prosody-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        run: |
          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qE '^(resources/prosody-plugins|tests/prosody)/' <<< "$FILES"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
          else
              echo "The PR does not change the prosody plugins or their tests"
              echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub App token
        id: app-token
        if: steps.files.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 #v3.3.0
        with:
          client-id: ${{ secrets.DOWNSTREAM_TESTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_TESTS_APP_KEY }}
          owner: ${{ vars.DOWNSTREAM_TESTS_OWNER }}
          repositories: ${{ vars.DOWNSTREAM_TESTS_REPO }}
          permission-actions: write

      - name: Start the downstream tests
        if: steps.files.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ vars.DOWNSTREAM_TESTS_OWNER }}/${{ vars.DOWNSTREAM_TESTS_REPO }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          HEAD_SHA: ${{ needs.authorize.outputs.head-sha }}
        run: |
          gh workflow run prosody-tests.yml -R "$TARGET_REPO" --ref master \
            -f jitsi_meet_commit="$HEAD_SHA" -f pr_number="$PR_NUMBER"
          echo "Started the prosody tests of $TARGET_REPO for $HEAD_SHA"
